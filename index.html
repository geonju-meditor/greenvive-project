<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오낚고? 오늘 낚시 고?</title>
<style>
  :root {
    --bg: #eaf4fb; --card: #ffffff; --ink: #14303f; --sub: #5b7686; --line: #d5e4ee;
    --wave: #1f78c8; --cur: #e8890c; --rec: rgba(46,160,90,.18);
    --green: #2ea05a; --yellow: #e0a800; --red: #d64545; --land: #cfe3c8; --land-line: #8fb38a; --sea: #dcedf8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1b24; --card: #14283a; --ink: #e6f1f8; --sub: #93adbd; --line: #25405a;
      --land: #2c4a3a; --land-line: #4f7a63; --sea: #10263a; }
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; line-height: 1.5; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.8rem; margin: 4px 0 2px; }
  .tag { color: var(--sub); margin: 0 0 14px; }
  .layout { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  @media (min-width: 900px) {
    html { font-size: 18px; }
    .layout { grid-template-columns: minmax(380px, 5fr) 6fr; }
    .mapcard { position: sticky; top: 12px; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .mapcard { padding: 10px; margin-bottom: 0; }
  .mapcard h2 { margin: 2px 6px 4px; }
  #map { max-height: 82vh; }
  .land { fill: var(--land); stroke: var(--land-line); stroke-width: 1.5; stroke-linejoin: round; }
  .sea { fill: var(--sea); }
  .spot { cursor: pointer; }
  .spot .dot { fill: #8aa1b0; stroke: #fff; stroke-width: 2.5; transition: r .15s; }
  .spot:hover .dot, .spot:focus .dot { r: 10; }
  .spot.sel .dot { stroke: var(--ink); stroke-width: 3; r: 10; }
  .spot.green .dot { fill: var(--green); } .spot.yellow .dot { fill: var(--yellow); } .spot.red .dot { fill: var(--red); }
  .spot text { font-size: 15px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-width: 4px; pointer-events: none; }
  .spot:focus { outline: none; }
  .legend { color: var(--sub); font-size: .8rem; margin: 4px 6px 2px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .light { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; }
  .light.green { color: var(--green); } .light.yellow { color: var(--yellow); } .light.red { color: var(--red); }
  .where { font-weight: 700; margin: 0; }
  .nums { color: var(--sub); margin: 0; }
  .chart-title { font-size: .85rem; color: var(--sub); margin: 8px 0 2px; }
  svg { width: 100%; height: auto; display: block; }
  .rec { margin: 8px 0 0; font-weight: 700; }
  .trend { margin: 6px 0 0; }
  .fishes { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .fishes { grid-template-columns: 1fr 1fr; } }
  .fish { background: var(--bg); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
  .fish .face { font-size: 2.4rem; line-height: 1; }
  .fish b { display: block; }
  .fish span { color: var(--sub); font-size: .92rem; }
  .says { margin: 0 0 10px; font-weight: 700; }
  .care p { margin: 6px 0 0; }
  .msg { color: var(--sub); margin: 0 0 12px; }
  .err { color: var(--red); }
  footer { color: var(--sub); font-size: .8rem; text-align: center; padding: 6px 0 20px; }
  [hidden] { display: none !important; }
  .picker { display: flex; gap: 8px; margin-bottom: 12px; }
  select, button { font: inherit; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); }
  select { flex: 1; min-width: 0; background: var(--card); color: var(--ink); }
  button { background: var(--wave); color: #fff; border-color: var(--wave); font-weight: 700; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>🎣 오낚고?</h1>
  <p class="tag">오늘 낚시 고? 지도에서 낚시터를 눌러 봐요.</p>

  <div class="layout">
    <section class="card mapcard">
      <h2>🗺️ 대한민국 낚시터 지도</h2>
      <svg id="map" viewBox="0 0 600 631" role="group" aria-label="대한민국 낚시터 지도"></svg>
      <p class="legend">점 색 = 신호등 (눌러 본 곳만 색이 바뀌어요) 🟢 가요 · 🟡 조심 · 🔴 쉬어요</p>
    </section>

    <section>
      <div class="picker">
        <select id="spot" aria-label="낚시터 선택"></select>
        <button id="go" type="button">오늘 낚시 고?</button>
      </div>
      <p id="status" class="msg" role="status">지도에서 낚시터를 눌러 봐요.</p>

      <div id="result" hidden>
        <div class="card">
          <p id="where" class="where"></p>
          <p id="light" class="light"></p>
          <p id="nums" class="nums"></p>
        </div>

        <div class="card">
          <h2>⏰ 시간대별 (오늘)</h2>
          <p class="chart-title">파도 높이 (m)</p>
          <div id="chartWave"></div>
          <p class="chart-title">해류 속도 (km/h)</p>
          <div id="chartCur"></div>
          <p id="rec" class="rec"></p>
          <p id="trend" class="trend"></p>
        </div>

        <div class="card">
          <h2>🐟 오늘의 안내</h2>
          <p id="says" class="says"></p>
          <div id="fishes" class="fishes"></div>
          <div class="care">
            <p id="careTalk"></p>
            <p id="familyTalk"></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer>
    데이터: Open-Meteo Marine API (모델 예측값, 참고용) · 지도: Natural Earth<br>
    신호등 기준과 어종 안내는 참고용이에요. 안전을 보장하지 않으니 현장 상황이 우선!
  </footer>
</main>

const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const results = {}; // 눌러 본 낚시터의 신호등 색
let selected = 0;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  Object.keys(attrs || {}).forEach((k) => e.setAttribute(k, attrs[k]));
  if (parent) parent.appendChild(e);
  return e;
}

function buildMap() {
  const svg = $("map");
  el("rect", { class: "sea", x: 0, y: 0, width: 600, height: 631, rx: 14 }, svg);
  el("path", { class: "land", d: LAND_PATH, "fill-rule": "evenodd" }, svg);
  SPOTS.forEach((s, i) => {
    const [x, y] = project(s.lon, s.lat);
    const g = el("g", { class: "spot", tabindex: 0, role: "button", "aria-label": s.name + " 낚시터" }, svg);
    g.dataset.i = i;
    el("circle", { class: "hit", cx: x, cy: y, r: 18, fill: "transparent" }, g);
    el("circle", { class: "dot", cx: x, cy: y, r: 7 }, g);
    const t = el("text", { x: x, y: y }, g);
    t.textContent = s.name;
    if (s.lab === "r") { t.setAttribute("x", x + 13); t.setAttribute("y", y + 5); }
    else if (s.lab === "l") { t.setAttribute("x", x - 13); t.setAttribute("y", y + 5); t.setAttribute("text-anchor", "end"); }
    else { t.setAttribute("y", y + 28); t.setAttribute("text-anchor", "middle"); }
    g.addEventListener("click", () => pick(i));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i); } });
  });
}

function markSelected() {
  document.querySelectorAll(".spot").forEach((g) => {
    const i = Number(g.dataset.i);
    g.classList.toggle("sel", i === selected);
    g.classList.remove("green", "yellow", "red");
    if (results[i]) g.classList.add(results[i]);
  });
}

function pick(i) {
  selected = i;
  $("spot").value = i;
  markSelected();
  load();
}

// ---------- 시작 ----------
const spotSel = $("spot");
SPOTS.forEach((s, i) => spotSel.add(new Option(s.name, i)));
buildMap();
markSelected();
spotSel.addEventListener("change", () => { selected = Number(spotSel.value); markSelected(); });
$("go").addEventListener("click", () => { selected = Number(spotSel.value); markSelected(); load(); });

// ---------- 데이터 불러오기 ----------
function makeUrl(lat, lon) {
  return "https://marine-api.open-meteo.com/v1/marine?latitude=" + lat.toFixed(3) + "&longitude=" + lon.toFixed(3) +
    "&hourly=sea_surface_temperature,wave_height,ocean_current_velocity" +
    "&past_days=7&forecast_days=1&timezone=Asia%2FSeoul";
}

async function fetchJson(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

// 값이 비어 있으면 바다 쪽으로 0.1도씩 밀어서 최대 3번 더 시도한다.
async function fetchSpot(spot) {
  for (let step = 0; step <= 3; step++) {
    const lat = spot.lat + spot.sea[0] * 0.1 * step;
    const lon = spot.lon + spot.sea[1] * 0.1 * step;
    const m = parse(await fetchJson(makeUrl(lat, lon)));
    if (m) return m;
  }
  return null;
}

let seq = 0;
async function load() {
  const my = ++seq;
  const idx = selected, spot = SPOTS[idx];
  $("go").disabled = true;
  showStatus(spot.name + " 바다 보는 중… 🌊");
  $("result").hidden = true;
  try {
    const m = await fetchSpot(spot);
    if (my !== seq) return;
    if (!m) { showStatus(spot.name + "은(는) 데이터가 없어요. 다른 낚시터를 골라 봐요.", true); return; }
    render(m, spot, idx);
  } catch (e) {
    if (my !== seq) return;
    showStatus("바다 정보를 못 불러왔어요. 잠시 뒤 '오늘 낚시 고?'를 다시 눌러 주세요.", true);
  } finally {
    if (my === seq) $("go").disabled = false;
  }
}

// JSON에서 오늘(마지막 날짜)과 7일 전(첫 날짜) 값을 나눠 담는다.
function parse(data) {
  const h = data && data.hourly;
  if (!h || !Array.isArray(h.time) || !h.time.length) return null;
  const t = h.time, sst = h.sea_surface_temperature, wh = h.wave_height, oc = h.ocean_current_velocity;
  if (!sst || !wh || !oc) return null;
  const todayStr = t[t.length - 1].slice(0, 10), firstStr = t[0].slice(0, 10);
  const today = { hours: [], sst: [], wave: [], cur: [] };
  const first = [];
  t.forEach((ts, i) => {
    const d = ts.slice(0, 10);
    if (d === todayStr) {
      today.hours.push(Number(ts.slice(11, 13)));
      today.sst.push(sst[i]); today.wave.push(wh[i]); today.cur.push(oc[i]);
    } else if (d === firstStr && typeof sst[i] === "number") first.push(sst[i]);
  });
  const ok = (a) => a.length > 0 && a.every((v) => typeof v === "number");
  if (!ok(today.sst) || !ok(today.wave) || !ok(today.cur)) return null;
  return { today, firstAvg: first.length ? avg(first) : null, todayStr };
}

// ---------- 계산 ----------
const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const pad = (n) => String(n).padStart(2, "0");
const levelOf = (v, y, r) => (v >= r ? 2 : v >= y ? 1 : 0);

function bestWindow(today) {
  const len = 3;
  let best = null;
  for (let i = 0; i + len <= today.hours.length; i++) {
    if (today.hours[i] < 5 || today.hours[i + len - 1] > 20) continue;
    let score = 0;
    for (let k = i; k < i + len; k++) score += today.wave[k] / WAVE_RED + today.cur[k] / CUR_RED;
    if (!best || score < best.score) best = { score, from: today.hours[i], to: today.hours[i + len - 1] + 1 };
  }
  return best;
}

// ---------- 화면 ----------
function render(m, spot, idx) {
  const d = m.today;
  const maxWave = Math.max(...d.wave), maxCur = Math.max(...d.cur);
  const lvl = Math.max(levelOf(maxWave, WAVE_YELLOW, WAVE_RED), levelOf(maxCur, CUR_YELLOW, CUR_RED));
  const L = LEVELS[lvl];
  const temp = avg(d.sst);

  results[idx] = L.cls;
  markSelected();

  $("where").textContent = "📍 " + spot.name;
  const light = $("light");
  light.className = "light " + L.cls;
  light.textContent = L.icon + " " + L.text;
  $("nums").textContent = "파도 최대 " + maxWave.toFixed(1) + "m · 해류 최대 " +
    maxCur.toFixed(1) + "km/h · 수온 " + temp.toFixed(1) + "°C";

  const win = bestWindow(d);
  $("chartWave").innerHTML = chart(d, d.wave, "var(--wave)", WAVE_YELLOW, WAVE_RED, win);
  $("chartCur").innerHTML = chart(d, d.cur, "var(--cur)", CUR_YELLOW, CUR_RED, win);
  $("rec").textContent = win
    ? "✅ 추천 시간: " + pad(win.from) + "~" + pad(win.to) + "시 (파도·해류가 가장 약한 구간)"
    : "추천 시간을 찾지 못했어요.";

  if (m.firstAvg === null) {
    $("trend").textContent = "수온 7일 변화: 데이터가 부족해요.";
  } else {
    const diff = temp - m.firstAvg;
    const arrow = diff > 0.2 ? "↗" : diff < -0.2 ? "↘" : "→";
    $("trend").textContent = "수온 7일 변화: " + arrow + " " + (diff > 0 ? "+" : "") + diff.toFixed(1) + "°C (7일 전 대비)";
  }

  const band = FISH_BY_TEMP.find((f) => temp < f.max);
  $("says").textContent = band.says.replace("{t}", temp.toFixed(1));
  const box = $("fishes");
  box.textContent = "";
  band.fish.forEach((f) => {
    const card = document.createElement("div"); card.className = "fish";
    const face = document.createElement("div"); face.className = "face"; face.textContent = f.face;
    const txt = document.createElement("div");
    const b = document.createElement("b"); b.textContent = f.name;
    const s = document.createElement("span"); s.textContent = f.note;
    txt.append(b, s); card.append(face, txt); box.appendChild(card);
  });
  $("careTalk").textContent = CARE_TALK[L.cls];
  $("familyTalk").textContent = FAMILY_TALK[L.cls];

  showStatus(spot.name + " · " + m.todayStr + " 예측 (참고용: 어종은 일반적인 시즌 정보)");
  $("result").hidden = false;
  if (window.matchMedia("(max-width: 899px)").matches) $("status").scrollIntoView({ behavior: "smooth", block: "start" });
}

// 간단한 SVG 선 그래프 (라이브러리 없음)
function chart(d, vals, color, yThr, rThr, win) {
  const W = 360, H = 130, L = 30, R = 8, T = 8, B = 20;
  const maxY = Math.max(rThr * 1.2, Math.max(...vals) * 1.1);
  const x = (i) => L + (i / (vals.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="시간대별 그래프">';
  if (win) {
    const i0 = d.hours.indexOf(win.from), i1 = Math.min(d.hours.indexOf(win.to), vals.length - 1);
    const x0 = x(i0), x1 = i1 >= 0 ? x(i1) : x(vals.length - 1);
    s += '<rect x="' + x0 + '" y="' + T + '" width="' + (x1 - x0) + '" height="' + (H - T - B) + '" fill="var(--rec)"/>';
  }
  [[yThr, "var(--yellow)"], [rThr, "var(--red)"]].forEach(([v, c]) => {
    if (v <= maxY) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) +
      '" stroke="' + c + '" stroke-dasharray="4 3" stroke-width="1"/>' +
      '<text x="' + (L - 4) + '" y="' + (y(v) + 3) + '" font-size="9" text-anchor="end" fill="var(--sub)">' + v + "</text>";
  });
  [0, 6, 12, 18, 23].forEach((hr) => {
    const i = d.hours.indexOf(hr);
    if (i >= 0) s += '<text x="' + x(i) + '" y="' + (H - 5) + '" font-size="9" text-anchor="middle" fill="var(--sub)">' + hr + "시</text>";
  });
  const pts = vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  s += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round"/>';
  const ni = d.hours.indexOf(new Date().getHours());
  if (ni >= 0) s += '<circle cx="' + x(ni) + '" cy="' + y(vals[ni]) + '" r="4" fill="' + color + '" stroke="var(--card)" stroke-width="2"/>';
  return s + "</svg>";
}

function showStatus(text, isErr) {
  const e = $("status");
  e.textContent = text;
  e.className = "msg" + (isErr ? " err" : "");
}
</script>
